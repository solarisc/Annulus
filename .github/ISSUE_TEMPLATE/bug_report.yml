name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please leave out anything private: real host names, addresses and keys aren't needed here. Security problems go through [SECURITY.md](https://github.com/solarisc/terminal-emu/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it for ourselves?
      placeholder: |
        1. Open Keychain
        2. Click Generate key
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Annulus version or commit
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: A screenshot, a recording, or the OS version and server software if it's about a connection.
