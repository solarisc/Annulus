name: Feature idea
description: Something you wish Annulus did.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at [FEATURES.md](https://github.com/solarisc/terminal-emu/blob/main/docs/FEATURES.md) first, since it may already be planned. Team sharing, mobile apps, a built-in AI assistant, Telnet, serial and Mosh are out of scope on purpose.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you have in mind, more than the button you'd add. How do you do it today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea of how it could work, if you have one.
