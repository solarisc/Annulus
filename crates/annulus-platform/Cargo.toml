[package]
name = "annulus-platform"
description = "Platform traits and their per-OS implementations: windowing, renderers, PTYs, secret stores, biometrics, FIDO2. The only crate allowed to use unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arboard.workspace = true
parley.workspace = true
softbuffer.workspace = true
swash.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
annulus-ui = { path = "../annulus-ui" }
webbrowser.workspace = true
winit.workspace = true
zeroize.workspace = true

[[test]]
name = "macos_frame"
harness = false

[target.'cfg(windows)'.dependencies]
accesskit_windows.workspace = true
windows-numerics.workspace = true

[target.'cfg(not(windows))'.dependencies]
accesskit_winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
