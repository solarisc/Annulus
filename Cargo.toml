[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarisc/terminal-emu"
publish = false

# Direct dependency versions are pinned here once; crates inherit them with `foo.workspace = true`.
[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# The timer that makes the server's header-read timeout count; already under axum-server.
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
argon2 = "0.6.0"
# Clipboard text only: no image support.
arboard = { version = "3.7.0", default-features = false }
base64 = "0.22.1"
# The self-signed certificate a LAN sync server pins (ADR-0018), and the tests' TLS servers.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
# setrlimit and prctl, to keep the open vault out of core dumps.
libc = "0.2.191"
sha2 = "0.11.1"
# Only to turn on prebuilt NASM objects on Windows, so builds need no NASM (ADR-0004).
aws-lc-rs = { version = "1.16.2", features = ["prebuilt-nasm"] }
rand = "0.10"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# opaque-ke 4 is built on the RustCrypto releases before sha2 0.11 and rand 0.9.
opaque-rand = { package = "rand", version = "0.8", default-features = false, features = ["getrandom", "std"] }
opaque-sha2 = { package = "sha2", version = "0.10" }
russh = "0.65.0"
russh-sftp = "3.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# rustls with aws-lc-rs, the crypto provider already in the build (russh); no ring.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
directories = "6.0.0"
# The accessibility tree and its platform adapters (ADR-0017).
accesskit = "0.25.2"
accesskit_windows = "0.35.2"
accesskit_winit = "0.34.2"
# Without wayland-csd-adwaita: we draw our own title bar (and it pulls in ttf-parser).
webbrowser = "1.2.4"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
windows = "0.62.2"
windows-numerics = "0.3.1"
parley = { version = "0.12.0", default-features = false, features = ["std"] }
softbuffer = "0.4.8"
swash = "0.2.10"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"
# How hard a master password is to guess: real password and word lists.
zxcvbn = { version = "3.1.1", default-features = false }

# `deny`, not `forbid`, since a `forbid` cannot be relaxed further down. Crates other than annulus-platform add
# `#![forbid(unsafe_code)]` in their crate root, and `cargo xtask docs-check` verifies it.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

# Tests draw hundreds of frames (the scenes, the random user), so the drawing code and the
# libraries under it are optimized even in debug and test builds. The app's own logic stays
# unoptimized, easy to step through.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.annulus-platform]
opt-level = 2

[profile.dev.package.annulus-ui]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Keep line tables in separate debug files (PDB on Windows, dSYM/.dwp elsewhere) for symbolication.
debug = "line-tables-only"
split-debuginfo = "packed"
