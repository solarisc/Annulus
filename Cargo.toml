[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarisc/terminal-emu"
publish = false

# Direct dependency versions are pinned here once; crates inherit them with `foo.workspace = true`.
[workspace.dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
argon2 = "0.6.0"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
# Only to turn on prebuilt NASM objects on Windows, so builds need no NASM (ADR-0004).
aws-lc-rs = { version = "1.16.2", features = ["prebuilt-nasm"] }
rand = "0.10"
opaque-ke = { version = "4.0.1", features = ["argon2"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# opaque-ke 4 is built on the RustCrypto releases before sha2 0.11 and rand 0.9.
opaque-rand = { package = "rand", version = "0.8", default-features = false, features = ["getrandom", "std"] }
opaque-sha2 = { package = "sha2", version = "0.10" }
russh = "0.65.0"
russh-sftp = "3.0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
# rustls with aws-lc-rs, the crypto provider already in the build (russh); no ring.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"

# `deny`, not `forbid`, since a `forbid` cannot be relaxed further down. Crates other than annulus-platform add
# `#![forbid(unsafe_code)]` in their crate root, and `cargo xtask docs-check` verifies it.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Keep line tables in separate debug files (PDB on Windows, dSYM/.dwp elsewhere) for symbolication.
debug = "line-tables-only"
split-debuginfo = "packed"
